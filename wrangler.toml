# GAIGS account API. Deploy from the repo root:
#   npx wrangler d1 migrations apply gaigs --remote
#   npx wrangler deploy
#
# account_id is omitted on purpose. Wrangler reads CLOUDFLARE_ACCOUNT_ID,
# `wrangler login`, or the GitHub Actions accountId input. Do not commit it.
name = "gaigs-api"
main = "cloudflare/src/index.js"
compatibility_date = "2026-10-24"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "gaigs"
database_id = "9852a8b3-ab59-4f73-a3ec-a5b6870ad214"
migrations_dir = "cloudflare/d1/migrations"

# R2 is off on this account, so the UPLOADS binding is commented out.
# An uncommented binding makes `wrangler deploy` fail until the bucket exists.
# Media routes return 503 while this stays commented. To turn uploads back on:
#   1. Enable R2 in the Cloudflare dashboard.
#   2. npx wrangler r2 bucket create gaigs-uploads
#   3. Uncomment the block below.
#   4. npx wrangler deploy
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "gaigs-uploads"

[vars]
# Optional extra browser origins for a future custom domain, comma-separated.
# The GitHub Pages origin, localhost, 127.0.0.1, and Capacitor are always allowed.
# Do not use "*": credentialed responses must name an exact origin.
# GAIGS_ALLOWED_ORIGINS = "https://gaigs.example"
GAIGS_ALLOWED_ORIGINS = ""
